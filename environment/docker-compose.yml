
services:
  server:
    image: ghcr.io/seatsurfing/backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      POSTGRES_URL: "postgres://seatsurfing:local_dev_password@db/seatsurfing?sslmode=disable"
      CRYPT_KEY: "0123456789abcdef0123456789abcdef"
      PUBLIC_SCHEME: "http"
      PUBLIC_PORT: "8080"
    depends_on:
      db:
        condition: service_healthy


  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_USER: seatsurfing
      POSTGRES_DB: seatsurfing
    volumes:
      - seatsurfing_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatsurfing -d seatsurfing"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  seatsurfing_db: